<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VOLF Rozvoz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>VOLF SK Rozvoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#edf0f5;--card:#fff;--ink:#18212f;--mute:#667085;--line:#dde3ec;--field:#fff;
  --head:#1c2430;--head-ink:#f2f5f9;--head-line:#364255;
  --orange:#0d9488;--orange-ink:#0f766e;--blue:#0b63d1;--blue-soft:#e8f1fd;
  --green:#188a52;--green-soft:#e3f5ea;--red:#d1292f;--red-soft:#fdecec;--amber:#a96a00;--amber-soft:#fff3d6;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Oswald","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{display:inline-block;vertical-align:-3px;flex:none}
.boot{padding:24px 16px;max-width:520px;margin:0 auto;color:var(--mute)}

/* hlavička */
.top{background:linear-gradient(135deg,#0b1324 0%,#14284f 55%,#0e3a5f 100%);color:#fff;position:sticky;top:0;z-index:6;box-shadow:0 6px 24px rgba(8,16,36,.28)}
.top1{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#22d3ee,#3b82f6);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(34,211,238,.35);flex:none}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font:700 19px/1.1 var(--f-body);letter-spacing:.01em;white-space:nowrap}
.brand small{font:500 11px/1.2 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:#7dd3fc;margin-top:4px}
.sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);border-radius:12px;color:#fff;font-weight:500;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.16)}
@media(max-width:400px){.hbtn .t{display:none}.brand b{font-size:17px}}
.chan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:2px 16px 14px;max-width:1100px;margin:0 auto}
.ctab{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;min-height:84px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#d3deef;font:700 14px/1.1 var(--f-body);text-align:left;min-width:0}
.ctab .tt{display:flex;align-items:center;gap:6px;max-width:100%}
.ctab .num{font:800 30px/1 var(--f-disp);color:#fff}
.ctab .sub{font:600 11px/1.1 var(--f-body);color:#ffd27a}
.ctab .sub.ok{color:#7be0a8}
.ctab .sub .l{display:none}
.ctab.arch{justify-content:center;align-items:center;gap:6px}
.ctab.on{background:#fff;color:#0b1324;box-shadow:0 3px 14px rgba(0,0,0,.3);border-color:#fff}
.ctab.on .num{color:#0b1324}
.ctab.on .sub{color:#b36b00}.ctab.on .sub.ok{color:var(--green)}
.ctab:hover:not(.on){background:rgba(255,255,255,.16)}
@media(min-width:900px){.chan{grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}.ctab{min-height:100px;padding:14px 18px;font-size:19px}.ctab .num{font-size:38px}.ctab .sub{font-size:13px}.ctab .sub .l{display:inline}.ctab .sub .s{display:none}}
.cnt{position:absolute;top:-7px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:600 12px/20px var(--f-body);text-align:center;box-shadow:0 0 0 2px #14284f}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}

/* panel dňa */
.tb1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sq{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;background:var(--card)}
.sq:hover{background:var(--bg)}
input[type=date]{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font:500 16px var(--f-body)}
.dlabel{font:500 16px var(--f-body);color:var(--mute)}
.dlabel b{font:600 20px/1 var(--f-disp);color:var(--ink);letter-spacing:.02em;text-transform:uppercase}
.tb2{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:500;text-decoration:none;color:var(--ink)}
.tbtn.blue{background:var(--blue-soft);border-color:#bcd5f6;color:var(--blue)}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kpi{display:inline-flex;align-items:baseline;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.kpi b{font:600 28px/1 var(--f-disp)}
.kpi span{color:var(--mute);font-size:14px}
.kpi.g b{color:var(--green)}.kpi.b b{color:var(--blue)}.kpi.a{background:var(--amber-soft);border-color:#f1dc9c}.kpi.a b,.kpi.a span{color:var(--amber)}
.kpi.r{background:var(--red-soft);border-color:#f3c1c3}.kpi.r b,.kpi.r span{color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.tiles.wide{grid-template-columns:repeat(2,1fr)}
.tile{min-height:56px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font:600 22px/1 var(--f-body);color:var(--fg,inherit);padding:0 8px}
.tiles.wide .tile{font-size:16px;min-height:52px}
.tile.on{background:#0b5fd6;border-color:#0b5fd6;color:#fff}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:500}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--mute);font-size:13px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid var(--line)}

/* tlač štítkov */
.lblbar{display:none;gap:10px;flex-wrap:wrap;align-items:center;background:var(--blue-soft);border:1px solid #bcd5f6;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.lblbar.show{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border-radius:16px 16px 0 0;border-width:1px 0 0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(15,30,60,.18);justify-content:space-between}
.lblbar.show .btn{margin-left:0}
.lblbar .ttl{display:flex;align-items:center;gap:8px;color:var(--blue);font:600 20px/1 var(--f-disp);letter-spacing:.03em}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:500}
.fmt{color:var(--ink);font-weight:500;padding:0 12px;min-height:40px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lblcount{color:var(--blue);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5}
.btn.orange{background:var(--orange)}
.btn.green{background:var(--green)}
.handover{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:76px;margin:0 0 12px;padding:12px 18px;border-radius:14px;background:var(--line);color:var(--mute);text-align:left;font-size:20px;cursor:not-allowed}
.handover span{display:flex;flex-direction:column;gap:3px}
.handover b{font-size:20px;font-weight:800}
.handover small{font-size:13px;font-weight:500;opacity:.9}
.handover.ok{background:var(--green);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--card);border:1px solid var(--red);color:var(--red)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.lblbar .btn{margin-left:auto}

/* rýchle pridanie */
.qa-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;color:var(--mute);font-size:16px;padding:4px 2px}
.qa-h .ic{transition:transform .15s}
.qa-h.open .ic{transform:rotate(90deg)}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;margin-top:12px}
.fld label,.sheet label{display:block;font-size:13px;color:var(--mute);margin:0 0 5px}
.fld.wide{grid-column:span 2}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px}
textarea{padding:10px 12px;min-height:76px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
input:disabled{background:var(--bg);color:var(--mute)}
.req{color:var(--red)}

/* riadok výdajky */
.o{position:relative;background:var(--card);border:1px solid var(--line);border-left:6px solid #c5ccd8;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.o.s-vyd{border-left-color:#f5a623;background:#fff9ec}
.o.s-lbl{border-left-color:#14b8c4;background:#e8f9fb}
.o.s-rdy{border-left-color:#1f9d55;background:#d9f3e2}
.o.s-veh{border-left-color:#3b82f6;background:#eef4ff}
.o.s-inc{border-left-color:#e5484d;background:#fff2f2}
.o.s-slip{border-left-color:#8b5cf6;background:#f5f0ff}
.ib.txt{width:auto;padding:0 12px;gap:6px;display:inline-flex;font-size:14px;font-weight:500}
.ib.txt.on{background:#efe7ff;border-color:#b59af5;color:#5b34c4}
.rn{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font:600 16px var(--f-disp);display:grid;place-items:center;flex:none}
.ib.sig{background:var(--green);border-color:var(--green);color:#fff}
.ib.nav{background:var(--blue);border-color:var(--blue);color:#fff}
#sig-c{display:block;width:100%;height:auto;aspect-ratio:640/260;border:2px dashed #9aa6b8;border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.sigimg{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
.rstat{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:14px;min-height:20px}
.chbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;font:600 20px var(--f-disp);letter-spacing:.02em;text-align:left}
.chbtn:hover{background:var(--bg)}
.o.done .oname{text-decoration:line-through;text-decoration-color:#9aa6b8}
.o.done{opacity:.78}
.r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chk{width:24px;height:24px;accent-color:var(--blue);flex:none}
.dv{width:34px;height:34px;border-radius:50%;border:2px solid #aab4c4;display:grid;place-items:center;color:transparent;flex:none;background:var(--card)}
.dv.on{background:var(--green);border-color:var(--green);color:#fff}
.oid{font:600 17px/1 var(--f-disp);color:var(--blue);letter-spacing:.03em}
.oname{font:600 21px/1.15 var(--f-disp);letter-spacing:.01em;overflow-wrap:anywhere;flex:1 1 140px;min-width:0}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;font:600 13px/1 var(--f-body);white-space:nowrap}
.bdg.goods{background:var(--red);color:#fff}
.bdg.v{background:#fbe9a8;color:#6a4d00;letter-spacing:.03em}
.bdg.m{background:var(--bg);color:var(--mute)}
.fchip.zero{opacity:.45}
.fbar{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.srch{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit}
.fbar .filters{margin-top:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fbar .fchip{flex:0 0 auto;white-space:nowrap}
.tbtn.pc,.kpi.pc{display:none}
@media(max-width:420px){.kpi{padding:8px 10px;gap:6px}.kpi b{font-size:22px;white-space:nowrap}.kpi span{font-size:12px}.kpis{flex-wrap:nowrap}.kpi{flex:1 1 0;min-width:0;flex-direction:column;align-items:flex-start;gap:2px}.tb2{margin-left:0;width:100%}.tb2 .tbtn{flex:1 1 auto;justify-content:center;padding:0 10px}}
@media(min-width:900px){
  .tbtn.pc{display:inline-flex}.kpi.pc{display:inline-flex}.tbtn.mob{display:none}
  .fbar{flex-direction:row;align-items:center}.srch{max-width:340px;flex:0 0 340px}.fbar .filters{flex-wrap:wrap;overflow:visible}
  .lblbar.show{left:50%;right:auto;transform:translateX(-50%);width:min(900px,96vw);border-width:1px;border-radius:16px 16px 0 0}
}
.fchip b{margin-left:4px;font-weight:700}
.bdg.cod{background:#ffe3c2;color:#8a4300}
.bdg.pay{background:var(--bg);color:var(--mute);font-weight:500}
.bdg.cash{background:var(--green-soft);color:var(--green)}
.bdg.dt{font-weight:800;letter-spacing:.04em;font-size:13px;padding:6px 11px;border:2px solid transparent}
.bdg.dt-bal{background:#efe3ff;color:#5a1fa8;border-color:#5a1fa8}
.bdg.dt-dop{background:#ffe9c9;color:#8a4300;border-color:#c26a00}
.bdg.dt-kur{background:#dcebff;color:#0b4a9e;border-color:#0b4a9e}
.bdg.dt-os{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.bdg.dt-roz,.bdg.dt-oth{background:var(--bg);color:var(--mute);border-color:var(--line)}
.pk{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:64px;height:60px;border-radius:12px;border:2px dashed var(--red);font:800 34px/1 var(--f-disp);color:var(--red);background:var(--red-soft);padding:0 10px}
.pk small{font:700 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase}
.pk.has{border:2px solid #d98a00;color:#2b1a00;background:#ffc94d}
.pk.static{cursor:default}
.needpack{background:var(--line)!important;color:var(--mute)!important}
.r2{margin:8px 0 0 0;color:var(--mute);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;overflow-wrap:anywhere}
.r2 a{font-weight:500}
.addr{text-decoration:underline dotted;text-underline-offset:3px;color:var(--ink)}
.addr.fx{display:flex;flex-direction:column;gap:2px;text-decoration:none;flex:1 1 100%}
.fx-city{font:800 22px/1.15 var(--f-body);color:var(--ink);text-decoration:underline dotted;text-underline-offset:4px}
.fx-street{font-size:15px;font-weight:700;color:#3d4757}
.co{font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts.big{gap:8px}.acts.big .ib.big{flex:1;justify-content:center;height:54px;font-size:16px;font-weight:600}
.ib.big{height:50px;font-size:16px;font-weight:600;min-width:120px}
.acts:not(.big) .ib.sig.big{flex:1 1 100%;justify-content:center}
.acts.big .ib.big{white-space:nowrap;font-size:15px;padding:0 8px}
.ib.todo{background:var(--blue);border-color:var(--blue)}
.ib.morebtn{margin-left:auto}
.acts2{display:none}
.slipm.on{background:var(--blue-soft);border-color:#9cc1f1;color:#5a1fa8}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.syncwarn{margin:10px 0 0;padding:10px 14px;border-radius:10px;background:#fdecec;border:1px solid #eba7aa;color:#8c1d22;font-weight:600;font-size:14px}
.pastwarn{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.pastwarn span{flex:1 1 260px}
.sh{cursor:pointer;user-select:none}.sh:hover{color:var(--ink)}.sh.on{color:var(--blue)}
.chip.y{background:#fff3cd;border-color:#f0d98a;color:#7a5b00}
.usr .w small{display:block;color:var(--mute);font-weight:400}
.rolebadge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin-left:6px}
.sumblk{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.sumblk td:last-child,.sumblk th:last-child{text-align:right}
.mnote{margin-top:8px;padding:7px 10px;border-radius:8px;background:#fff6dc;border:1px solid #f0d98a;color:#6b4e00;font-size:13.5px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.mnote b{font-weight:700}
.rw-note{margin-top:4px;padding:4px 8px;border-radius:6px;background:#fff4cc;border:1px solid #f0d46a;font-size:13px;line-height:1.3;color:#6b4a00;font-weight:600;white-space:normal;overflow-wrap:anywhere}
.rw-note.man{background:#e9f1ff;border-color:#a9c4f2;color:#1d3f7a}
button.chip{cursor:pointer;font-family:inherit}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:#4b5668}
.chip.g{background:#e7f7ee;border-color:#9bd9b5;color:#17713f}.chip.p{background:#efe7ff;border-color:#b59af5;color:#5b34c4}.chip.b{background:var(--blue-soft);border-color:#9cc1f1;color:var(--blue)}.chip.r{background:var(--red-soft);border-color:#eba7aa;color:var(--red)}
.mrow.on{background:var(--blue-soft);border-color:#9cc1f1}.mrow.del{color:var(--red)}
.mrow.del.sure{background:var(--red);color:#fff}
.o.drv .oname{font-size:22px}
@media(min-width:900px){
  main,.top1,.chan{max-width:1400px}
  .olist{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .olist .o{margin-bottom:0}
  .olist .empty{grid-column:1/-1}
  .ib.slipm{display:none}
  .acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .ib.morebtn{display:none}
  .ib.todo,.acts:not(.big) .ib.sig.big{flex:0 1 auto;min-width:200px}
  .acts.big .ib.big{font-size:16px}
}
@media(min-width:900px){
  .olist.tbl{display:block}
  .rwh,.rw{display:grid;grid-template-columns:26px 64px minmax(0,1fr) 142px 44px 64px 118px 150px 84px;align-items:center;gap:10px}
  .rwh{padding:0 14px 6px;font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  .rw{padding:8px 14px;margin-bottom:6px;min-height:60px;cursor:pointer}
  .rw:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .rw .oid{display:flex;align-items:center;gap:4px}
  .rw-main{min-width:0}
  .rw-l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rw .oname{flex:0 1 auto;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis}

    depotTxt = depotTxt || DEPOT; try { localStorage.setItem('volf.depot', depotTxt); } catch (e) { /* bez ukladania */ }
    var list = chanOrders().filter(function (o) { return o.channel === 'Rozvoz BA'; });
    if (!list.length) { stat.textContent = 'Nie sú žiadne výdajky na zoradenie.'; return; }
    go.disabled = true;
    var todo = list.filter(function (o) { return o.lat == null || o.lng == null; }), done = 0, chain = Promise.resolve();
    todo.forEach(function (o) {
      chain = chain.then(function () {
        stat.textContent = 'Hľadám súradnice ' + (done + 1) + ' / ' + todo.length + ': ' + (o.address || o.customer);
        return geocodeList(geoQueries(o)).then(function (r) {
          done++;
          if (r) {
            o.lat = r.lat; o.lng = r.lng;
            api('/rest/v1/mrp_orders?id=eq.' + encodeURIComponent(o.id), { method: 'PATCH', body: { lat: r.lat, lng: r.lng }, prefer: 'return=minimal' }).catch(function () { /* súradnice ostanú v pamäti */ });
          }
          return sleep(1100);
        });
      });
    });
    var start = null;
    chain.then(function () {
      stat.textContent = 'Zisťujem štart…';
      if (useGps) return getPosition().then(function (p) { start = p; });
    }).then(function () {
      if (!start && depotTxt) return geocodeList([depotTxt + ', Slovensko', depotTxt]).then(function (r) { start = r; });
    }).then(function () {
      var ok = list.filter(function (o) { return o.lat != null && o.lng != null; }), bad = list.filter(function (o) { return o.lat == null || o.lng == null; });
      if (!ok.length) throw new Error('Nepodarilo sa nájsť súradnice žiadnej adresy. Skontrolujte internet a adresy.');
      stat.textContent = 'Počítam najkratšiu trasu…';
      var pts = (start ? [start] : []).concat(ok.map(function (o) { return { lat: o.lat, lng: o.lng }; }));
      return distMatrix(pts).then(function (D) {
        var tour, orderIds;
        if (start) {
          tour = solvePath(D);
          orderIds = tour.slice(1).map(function (x) { return ok[x - 1]; });
        } else {
          // bez štartu: fiktívny uzol 0 s nulovými vzdialenosťami = voľný začiatok trasy
          var D2 = [Array(D.length + 1).fill(0)];
          D.forEach(function (row) { D2.push([0].concat(row)); });
          tour = solvePath(D2);
          orderIds = tour.slice(1).map(function (x) { return ok[x - 1]; });
        }
        bad.sort(routeCmp).forEach(function (o) { orderIds.push(o); });
        return orderIds;
      }).then(function (ordered) {
        stat.textContent = 'Ukladám poradie…';
        return Promise.all(ordered.map(function (o, i) {
          var prev = o.route_pos; o.route_pos = i + 1;
          return api('/rest/v1/mrp_orders?id=eq.' + encodeURIComponent(o.id), { method: 'PATCH', body: { route_pos: i + 1 }, prefer: 'return=minimal' })
            .catch(function (e) { o.route_pos = prev; throw e; });
        })).then(function () { return ordered.length - bad.length; });
      }).then(function (n) {
        closeModal(); render();
        toast('Trasa uložená (' + n + ' zastávok)' + (bad.length ? ', ' + bad.length + ' bez nájdených súradníc je na konci' : ''));
      });
    }).catch(function (e) { stat.textContent = 'Chyba: ' + e.message; go.disabled = false; });
  }

    sheet('<h2>Podpis zákazníka</h2><p>' + esc(o.customer) + ' · výdajka ' + esc(dn(o.id)) + '</p>' +
      '<canvas id="sig-c" width="640" height="260" aria-label="Plocha na podpis"></canvas>' +
      '<div class="fld"><label for="sig-name">Meno podpisujúceho (nepovinné)</label><input type="text" id="sig-name"></div>' +
      '<div class="row"><button class="btn grow orange" data-act="dosign" data-id="' + esc(o.id) + '">' + ic('check', 18) + ' Potvrdiť doručenie</button><button class="btn ghost" data-act="clearsig">Vymazať</button><button class="btn ghost" data-act="close">Zrušiť</button></div>');

  function initSigCanvas() {
    var c = $('sig-c'); if (!c) return;
    var ctx = c.getContext('2d'), drawing = false, last = null;
    function reset() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; sigDirty = false; }
    reset(); c._reset = reset;
    function pos(e) { var r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; }
    c.addEventListener('pointerdown', function (e) { drawing = true; last = pos(e); try { c.setPointerCapture(e.pointerId); } catch (x) { /* nič */ } ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + 0.1, last.y + 0.1); ctx.stroke(); sigDirty = true; e.preventDefault(); });
    c.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; e.preventDefault(); });

      }
      if (!(n >= 1) || !w) { toast('Zadajte počet balíkov (aspoň 1) a vyberte skladníka'); return; }
      closeModal();
      patchOrder(id, { packages: n, worker: w, label_printed: false }, 'Uložené: ' + n + ' × štítok, skladník ' + w).then(function (ok) {
        if (ok) { var saved = findOrder(id); if (saved) printOrders([saved]); }
      });
    }
    else if (act === 'saveedit' && o) {
      var f = { payment: $('e-pay').value, amount: Number($('e-sum').value) || 0, goods: $('e-goods').checked, note: $('e-note').value.trim() || null };
      if (!$('e-name').disabled) {
        var nm = $('e-name').value.trim(); if (!nm) { toast('Zadajte adresáta'); return; }
        f.customer = nm; f.address = $('e-street').value.trim(); f.zip = $('e-zip').value.trim() || null; f.city = $('e-city').value.trim(); f.phone = $('e-phone').value.trim() || null; f.lat = null; f.lng = null;
      }
      closeModal(); patchOrder(id, f, 'Výdajka ' + id + ' bola upravená');
    }
    else if (act === 'pickcust') {
      var c = (state.qaFind || [])[parseInt(node.getAttribute('data-i'), 10)];
      if (c) { state.qa.name = c.name; state.qa.street = c.street || ''; state.qa.city = c.city || ''; state.qa.zip = c.zip || ''; state.qa.phone = c.phone || ''; if (c.label && !state.qa.note) state.qa.note = c.label; state.qaPicked = true; state.qaFind = []; render(); }
    }
    else if (act === 'qatoggle') { state.quickOpen = !state.quickOpen; render(); }
    else if (act === 'qaadd') { quickAdd(); }
    else if (act === 'dologin') { doLogin(); }
    else if (act === 'addworker') { addWorker(); }
    else if (act === 'pastmove') {
      var target = dayOrNext(todayStr());
      api('/rest/v1/mrp_orders?delivered=eq.false&order_date=lt.' + todayStr() + '&channel=in.' + PAST_CH, { method: 'PATCH', body: { order_date: target }, prefer: 'return=minimal' })
        .then(function () { var n = state.past.length; state.date = target; return reloadAll(false).then(function () { toast('Presunutých výdajok: ' + n); }); })
        .catch(function (e) { toast('Nepodarilo sa presunúť: ' + e.message); });
    }
    else if (act === 'pastshow') {
      var f = state.past[0]; if (!f) return;
      state.channel = f.channel; state.date = f.order_date; state.filter = 'all'; state.q = ''; state.sort = null; state.selected = {}; reloadAll(false);
    }
    else if (act === 'usradd') {
      userCall({ action: 'create', email: $('u-email').value, role: $('u-role').value, password: $('u-pass').value }).then(loadUsers).then(function () { render(); toast('Používateľ pridaný'); }).catch(function (e) { toast(e.message); });
    }
    else if (act === 'usrrole') { userCall({ action: 'setrole', user_id: id, role: v }).then(loadUsers).then(function () { render(); toast('Rola zmenená'); }).catch(function (e) { toast(e.message); }); }
    else if (act === 'usrpw') {
      state.pwTarget = id;
      sheet('<h2>Nové heslo</h2><p>' + esc(node.getAttribute('data-name')) + '</p><div class="fld"><label for="u-newpw">Nové heslo (min. 10 znakov, písmeno aj číslica)</label><input type="text" id="u-newpw" autocomplete="off"></div>' +
        '<div class="row"><button class="btn grow" data-act="usrpwsave">Uložiť heslo</button><button class="btn ghost" data-act="close">Zrušiť</button></div>');
    }
    else if (act === 'ownpw') {
      sheet('<h2>Zmeniť moje heslo</h2><div class="fld"><label for="o-pw1">Nové heslo (min. 10 znakov, písmeno aj číslica)</label><input type="password" id="o-pw1" autocomplete="new-password"></div>' +
        '<div class="fld"><label for="o-pw2">Nové heslo znova</label><input type="password" id="o-pw2" autocomplete="new-password"></div>' +
        '<div class="row"><button class="btn grow" data-act="ownpwsave">Uložiť heslo</button><button class="btn ghost" data-act="close">Zrušiť</button></div>');
    }
    else if (act === 'ownpwsave') {
      var np1 = $('o-pw1').value, np2 = $('o-pw2').value;
      if (np1 !== np2) { toast('Heslá sa nezhodujú'); return; }
      userCall({ action: 'changeown', password: np1 }).then(function () { closeModal(); toast('Heslo bolo zmenené'); }).catch(function (e) { toast(e.message); });
    }
    else if (act === 'usrpwsave') { userCall({ action: 'resetpw', user_id: state.pwTarget, password: $('u-newpw').value }).then(function () { closeModal(); toast('Heslo zmenené'); }).catch(function (e) { toast(e.message); }); }
    else if (act === 'usrdel') { confirmThen(node, function () { userCall({ action: 'delete', user_id: id }).then(loadUsers).then(function () { render(); toast(node.getAttribute('data-name') + ' bol zmazaný'); }).catch(function (e) { toast(e.message); }); }); }
    else if (act === 'sound') { store('volf.sound', soundOn() ? 'off' : 'on'); if (soundOn()) chime(); render(); }
    else if (act === 'editworker') { openWorkerEdit(id); }
    else if (act === 'saveworker') { saveWorker(id); }
    else if (act === 'delworker') { confirmThen(node, function () { delRow('/rest/v1/mrp_workers?id=eq.', id, loadWorkers, 'Skladník ' + node.getAttribute('data-name') + ' bol odstránený'); }); }
    else if (act === 'addokolie') { addOkolie(); }
    else if (act === 'delokolie') { confirmThen(node, function () { delRow('/rest/v1/okolie_customers?id=eq.', id, function () { return Promise.all([loadOkolie(), loadOrders()]); }, node.getAttribute('data-name') + ' bol odstránený zo zoznamu'); }); }
  });
  function confirmThen(btn, fn) {
    if (btn.getAttribute('data-sure') !== '1') { btn.setAttribute('data-sure', '1'); btn.textContent = 'Potvrdiť odstránenie'; return; }
    fn();
  }
  function delRow(path, id, reload, msg) {
    api(path + encodeURIComponent(id), { method: 'DELETE', prefer: 'return=minimal' }).then(reload).then(function () { render(); toast(msg); })
      .catch(function (e) { toast('Nepodarilo sa odstrániť: ' + e.message); });
  }

  var archTimer = null;
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'srch') { state.q = ev.target.value; refreshList(); return; }
    var t = ev.target, k = t && t.getAttribute && t.getAttribute('data-qa');
    if (k) state.qa[k] = t.value;
    if (t && t.id === 'qa-find') { clearTimeout(custTimer); custTimer = setTimeout(function () { searchCust(t.value); }, 300); }
    if (t && t.id === 'aq') {
      clearTimeout(archTimer);
      archTimer = setTimeout(function () {
        state.archQ = t.value;
        loadArch().then(function () { var b = $('arch-body'); if (b) b.innerHTML = archListHtml(); }).catch(function (e) { toast(e.message); });
      }, 350);
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target; if (!t) return;
    if (t.id === 'adt') { if (t.value) { state.archDate = t.value; state.archQ = ''; loadArch().then(render).catch(function (e) { toast(e.message); }); } return; }
    if (t.id === 'st-from' || t.id === 'st-to') { var sf = $('st-from').value, st2 = $('st-to').value; if (sf && st2) { state.statFrom = sf; state.statTo = st2; state.stats = null; render(); loadStats().then(render).catch(function (e) { toast(e.message); }); } return; }
    if (t.id === 'dt') { if (t.value) { state.date = t.value; state.selected = {}; reloadAll(false); } return; }
    var sel = t.getAttribute && t.getAttribute('data-sel');
    if (sel) { if (t.checked) state.selected[sel] = true; else delete state.selected[sel]; lblBarUpdate(); return; }
    var k = t.getAttribute && t.getAttribute('data-qa'); if (k) state.qa[k] = t.value;
  });
  document.addEventListener('focusout', function () { if (state.dirty) setTimeout(function () { if (!isTyping()) render(); }, 0); });
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && splitMode() && !ev.ctrlKey && !ev.metaKey && !ev.altKey && !isTyping() && !$('modal').innerHTML) {
      var l = visible(); if (!l.length) return;
      var i = -1; l.forEach(function (o, k) { if (o.id === state.sel) i = k; });
      i = Math.max(0, Math.min(l.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)));
      state.sel = l[i].id; state.selIdx = i; ev.preventDefault(); refreshList();
      var r = document.querySelector('.rw.sel'); if (r && r.scrollIntoView) r.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (ev.key !== 'Enter' || !ev.target) return;
    var id = ev.target.id;
    if (id === 'l-pass' || id === 'l-email') doLogin();
    else if (id === 'ok-name') addOkolie();
    else if (id === 'pin-in') { var pb = document.querySelector('[data-act="pinok"]'); if (pb) pb.click(); }
    else if (id === 'p-count') { var b = document.querySelector('[data-act="savepack"]'); if (b) b.click(); }
  });

  function quickAdd() {
    var q = state.qa, name = q.name.replace(/\s+/g, ' ').trim();
    if (!name) { toast('Zadajte adresáta'); return; }
    var id = q.id.trim() || ('M' + String(Date.now()).slice(-7));
    if (findOrder(id)) { toast('Výdajka s číslom ' + id + ' už existuje'); return; }
    var t = new Date(), time = pad(t.getHours()) + ':' + pad(t.getMinutes());
    var row = { id: id, customer: name, address: q.street.trim(), city: q.city.trim(), zip: q.zip.trim() || null, phone: q.phone.trim() || null, note: q.note.trim() || null,
      payment: q.pay, amount: Number(q.sum) || 0, packages: Math.max(0, parseInt(q.pk, 10) || 0), channel: state.channel, order_date: isDated() ? state.date : todayStr(), time: time, source: 'manual', status: 'Pripravená' };
    api('/rest/v1/mrp_orders', { method: 'POST', body: row, prefer: 'return=minimal' })
      .then(loadOrders).then(function () {
        if (!state.qaPicked && (row.address || row.city)) {
          api('/rest/v1/mrp_customers', { method: 'POST', prefer: 'return=minimal', body: { name: row.customer, street: row.address || '', city: row.city || '', zip: row.zip, phone: row.phone, source: 'manual' } }).catch(function () { /* už existuje */ });
        }
        state.qaPicked = false; state.qaFind = [];
        state.qa = { id: '', name: '', street: '', zip: '', city: '', phone: '', note: '', pay: 'Faktúra', pk: '0', sum: '0' };
        render(); toast('Výdajka ' + id + ' bola pridaná');
      }).catch(function (e) { toast('Nepodarilo sa pridať: ' + e.message); });
  }
  function doLogin() {
    var email = $('l-email').value.trim(), pass = $('l-pass').value, err = $('l-err'), btn = $('l-go');
    if (!email || !pass) { err.style.display = 'block'; err.textContent = 'Zadajte e-mail aj heslo'; return; }
    btn.disabled = true; btn.textContent = 'Overujem…'; err.style.display = 'none';
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: pass }) })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(/invalid/i.test(j.error_description || j.msg || '') ? 'Nesprávny e-mail alebo heslo' : 'Prihlásenie sa nepodarilo (' + r.status + ')');
          saveSession(j);
        });
      }).then(function () { return Promise.all([checkAdmin(), checkStaff()]); }).then(function (r) {
        if (r[1] === null) { clearSession(); throw new Error('Nepodarilo sa overiť účet, skúste znova'); }
        if (!state.isStaff) { clearSession(); throw new Error('Tento účet nemá prístup do aplikácie'); }
        closeModal(); state.view = 'rozvoz'; state.loading = true; render();
        return pickStartDate().then(function () { return reloadAll(false); }).then(function () { toast(state.isAdmin ? 'Prihlásený správca' : 'Prihlásený'); });
      }).catch(function (e) {
        var msg = e.message === 'Failed to fetch' ? 'Nepodarilo sa pripojiť na server. Skontrolujte internet.' : e.message;
        var er = $('l-err'), b = $('l-go'); if (!er) return;
        er.style.display = 'block'; er.textContent = msg; b.disabled = false; b.textContent = 'Prihlásiť sa';
      });
  }
  function openWorkerEdit(id) {
    var w = state.workers.filter(function (x) { return x.id === id; })[0]; if (!w) return;
    sheet('<h2>Upraviť skladníka</h2><div class="fld"><label>Meno a priezvisko</label><input type="text" id="we-name" value="' + esc(w.name) + '"></div>' +
      '<div class="fld"><label>Pozícia</label><input type="text" id="we-role" value="' + esc(w.role || '') + '"></div>' +
      '<div class="fld"><label>Zmena</label><input type="text" id="we-shift" value="' + esc(w.shift || '') + '"></div>' +
      '<p class="hint">Pri zmene mena sa nové meno prepíše aj pri už zadaných výdajkách (aj v archíve), aby sedeli odmeny a štatistiky.</p>' +
      '<div class="row"><button class="btn grow" data-act="saveworker" data-id="' + esc(w.id) + '">Uložiť</button><button class="btn ghost" data-act="close">Zrušiť</button></div>');
  }
  function saveWorker(id) {
    var w = state.workers.filter(function (x) { return x.id === id; })[0]; if (!w) return;
    var name = $('we-name').value.replace(/\s+/g, ' ').trim(), role = $('we-role').value.trim(), shift = $('we-shift').value.trim();
    if (!name) { toast('Zadajte meno skladníka'); return; }
    if (state.workers.some(function (x) { return x.id !== id && plain(x.name) === plain(name); })) { toast('Skladník s týmto menom už existuje'); return; }
    var old = w.name;
    closeModal();
    api('/rest/v1/mrp_workers?id=eq.' + encodeURIComponent(id), { method: 'PATCH', prefer: 'return=minimal', body: { name: name, role: role || 'Skladník', shift: shift || '06:00 – 14:00' } })
      .then(function () { return old !== name ? api('/rest/v1/mrp_orders?worker=eq.' + encodeURIComponent(old), { method: 'PATCH', prefer: 'return=minimal', body: { worker: name } }) : null; })
      .then(function () { return Promise.all([loadWorkers(), loadOrders()]); })
      .then(function () { render(); toast('Skladník upravený'); })
      .catch(function (e) { toast('Nepodarilo sa upraviť: ' + e.message); });
  }
  function addWorker() {
    var name = $('w-name').value.trim(), role = $('w-role').value.trim(), shift = $('w-shift').value.trim();
    if (!name) { toast('Zadajte meno skladníka'); return; }
    var pos = state.workers.reduce(function (m, w) { return Math.max(m, w.position || 0); }, 0) + 1;
    api('/rest/v1/mrp_workers', { method: 'POST', prefer: 'return=minimal', body: { name: name, role: role || 'Skladník', shift: shift || '06:00 – 14:00', status: 'Na smene', position: pos } })
      .then(loadWorkers).then(function () { render(); toast('Skladník pridaný'); }).catch(function (e) { toast('Nepodarilo sa pridať: ' + e.message); });
  }
  function addOkolie() {
    var name = $('ok-name').value.replace(/\s+/g, ' ').trim();
    if (!name) { toast('Zadajte meno zákazníka'); return; }
    if (state.okolie.some(function (c) { return plain(c.name) === plain(name); })) { toast('Tento zákazník už je v zozname'); return; }
    api('/rest/v1/okolie_customers', { method: 'POST', prefer: 'return=minimal', body: { name: name, channel: ($('ok-ch') && $('ok-ch').value === 'Osobný odber') ? 'Osobný odber' : 'Okolie' } })
      .then(function () { return Promise.all([loadOkolie(), loadOrders()]); })
      .then(function () { render(); toast('Pridané. Nedokončené výdajky sú preradené.'); }).catch(function (e) { toast('Nepodarilo sa pridať: ' + e.message); });
  }

  // ---------- štart ----------
  try { var saved = store('volf.session'); if (saved) state.session = JSON.parse(saved); } catch (e) { state.session = null; }
  var startup = state.session && state.session.expires_at < Math.floor(Date.now() / 1000) + 60 ? refreshSession().catch(function () {}) : Promise.resolve();
  function pickStartDate() {
    var t = todayStr();
    return api('/rest/v1/mrp_orders?select=order_date&delivered=eq.false&channel=in.(' + encodeURIComponent('"Rozvoz BA","FaxCopy"') + ')&order_date=gte.' + t + '&order=order_date.asc&limit=1')
      .then(function (rows) { if (rows && rows[0] && rows[0].order_date) { state.date = rows[0].order_date; state.archDate = t; } })
      .catch(function () { /* ostane dnešný dátum */ });
  }
  render();
  startup.then(function () {
    if (!state.session) { render(); return; }
    return Promise.all([checkAdmin(), checkStaff()]).then(function (r) {
      if (r[1] === false) { clearSession(); render(); return; }
      return pickStartDate().then(function () { return reloadAll(false); });
    });
  });
  setInterval(function () { if (state.session && !document.hidden && !$('modal').innerHTML) reloadAll(true); }, 30000);
  setInterval(function () { if (!document.hidden) checkNew(); }, 20000);
  setTimeout(function () { checkSync(); }, 1500);
  setTimeout(checkNew, 3000);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
